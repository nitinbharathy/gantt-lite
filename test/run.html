<!doctype html><meta charset="utf-8"><body>
<script src="harness.js"></script>
<script src="golden/goldens.js"></script>
<script>
// --- tiny test framework: test(name, async fn), eq(actual, expected) ---
const tests = [];
const test = (name, fn) => tests.push({name, fn});
function eq(a, b) {
  if (a === b) return;
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  const cut = s => JSON.stringify(s.slice(Math.max(0, i - 80), i + 80));
  throw new Error(`differs at index ${i} (lengths ${a.length} vs ${b.length})\n  actual:   ${cut(a)}\n  expected: ${cut(b)}`);
}

// --- tests ---
for (const k in CASES)
  test("legacy golden: " + k, async () => eq(await legacyCapture(CASES[k]), GOLDEN[k]));

// direct renderer: same opts as the golden cases, same goldens
const NOW = new Date(2027, 10, 10, 12), NOW_OUT = new Date(2026, 10, 26, 12);
const DIRECT = {
  "view":      (m) => ({now: NOW}),
  "edit":      (m) => ({now: NOW, editing: true, selected: m.lanes[0].items[2]}),
  "edit-lane": (m) => ({now: NOW, editing: true, selectedLane: m.lanes[1]}),
  "nolulls":   (m) => ({now: NOW, showLulls: false}),
  "outside":   (m) => ({now: NOW_OUT}),
};
for (const k in DIRECT)
  test("renderGantt golden: " + k, async () => {
    const {normalize, renderGantt} = await loadApi(), {model} = normalize(await loadSample());
    const before = JSON.stringify(model), svg = renderGantt(model, DIRECT[k](model));
    eq(svg, GOLDEN[k]);
    eq(JSON.stringify(model), before); // renderGantt must not touch the data
  });

test("idPrefix: two charts have no duplicate ids", async () => {
  const {normalize, renderGantt} = await loadApi(), {model} = normalize(await loadSample());
  const a = renderGantt(model, {idPrefix: "a-"}), b = renderGantt(model, {idPrefix: "b-"});
  const ids = (a + b).match(/\bid="[^"]*"/g) || [];
  eq(String(new Set(ids).size), String(ids.length));
  eq(String(ids.length > 0 && a.includes('url(#a-hatch)') && b.includes('url(#b-hatch)')), "true");
});

// escaping: strings with markup, entities and quotes must show up as text, and the SVG must stay well-formed
const NASTY = ['<b>bold</b>', '&amp; x', 'say "hi"', "it's <i>"];
const nastyRaw = () => ({
  title: NASTY[0],
  kinds: {a: ["Kind", "#336699"]},
  months: ['<b>M1</b>', 'M2 &amp;', 'M"3"'],
  quarters: [['<b>Q1</b>', 0, 12, 'ph "<i>"', "#2F6FDE"]],
  lulls: [[1, 2, 'lull <b>"&amp;']],
  lanes: [{n: '<b>Lane</b> &amp; "x"', info: ['info <b>one</b> &amp; "two" it\'s'], items: [
    {t: '<b>Item</b> &amp; "q" it\'s', k: "a", s: [1, 5], d: 'hover <b>tip</b> &amp; "x" it\'s'}]}],
});
const html = (s) => { const d = document.createElement("div"); d.innerHTML = s; return d; };
test("escaping: SVG has no raw tags from data and parses as XML", async () => {
  const {normalize, renderGantt} = await loadApi(), {model} = normalize(nastyRaw());
  const svg = renderGantt(model, {now: NOW, editing: true});
  if (svg.includes("<b>") || svg.includes("<i>")) throw new Error("raw tag in SVG");
  // data-d keeps a literal <br> on purpose (the tooltip inserts it as HTML), which XML forbids inside an attribute; swap it for the check
  const doc = new DOMParser().parseFromString(svg.replace(/<br>/g, "&lt;br&gt;"), "image/svg+xml");
  if (doc.querySelector("parsererror")) throw new Error("not well-formed: " + doc.querySelector("parsererror").textContent.slice(0, 200));
  const text = doc.documentElement.textContent;
  for (const want of ['<b>Item</b> &amp; "q" it\'s', '<b>Lane</b> &amp; "x"', 'info <b>one</b> &amp; "two" it\'s', '<b>M1</b>', 'M2 &amp;', 'M"3"', '<b>Q1</b>', 'ph "<i>"'])
    if (!text.includes(want)) throw new Error("text missing: " + want);
});
test("escaping: HTML parser sees text only, and the tooltip text is the original", async () => {
  const {normalize, renderGantt} = await loadApi(), {model} = normalize(nastyRaw());
  const d = html(renderGantt(model, {now: NOW}));
  if (d.querySelector("b,i")) throw new Error("data produced a real <b> or <i> element in the chart");
  const g = d.querySelector("g[data-i]"), l = d.querySelector("g.lull");
  // same expression as the tooltip code in gantt.html
  const tipHtml = (g) => "<b>" + g.dataset.t + "</b>" + (g.dataset.d ? "<br>" + g.dataset.d : "");
  const t = html(tipHtml(g));
  eq([...t.querySelectorAll("*")].map(e => e.tagName).join(), "B,BR,BR"); // title, then one <br> before the week range and one before the hover text
  for (const want of ['<b>Item</b> &amp; "q" it\'s', 'hover <b>tip</b> &amp; "x" it\'s'])
    if (!t.textContent.includes(want)) throw new Error("tooltip text missing: " + want);
  eq(html(tipHtml(l)).textContent, 'lull <b>"&amp;');
});
test("escaping: legend, lull label and Type options are escaped by gantt.html", async () => {
  const src = await textOf(GANTT_URL);
  for (const want of ["esc(t)}</span>`)", "esc(model.lullLabel)", "esc(v[0])}</option>"])
    if (!src.includes(want)) throw new Error("gantt.html does not escape: " + want);
});

// --- runner ---
(async () => {
  let pass = 0, fails = [];
  for (const t of tests) {
    try { await t.fn(); pass++; } catch (e) { fails.push(`FAIL ${t.name}\n  ${e.message}`); }
  }
  const head = fails.length ? `FAIL ${fails.length}/${tests.length}` : `PASS ${pass}/${tests.length}`;
  emit([head, ...fails].join("\n") + "\n");
})();
</script>
